spring:
  application:
    name: spin-backend-challenge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/challenge}
    username: ${DB_USERNAME:challenge}
    password: ${DB_PASSWORD:challenge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    generator:
      # Money is NUMERIC(19,2); serialize it as plain text so a large value never becomes 1.0E+14.
      write-bigdecimal-as-plain: true

server:
  port: ${SERVER_PORT:8080}

provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8081}
  connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
  read-timeout: ${PROVIDER_READ_TIMEOUT:5s}

# Retry is applied outside the circuit breaker (see ProviderHttpAdapter), so every attempt is
# recorded by the breaker. Both instances only react to ProviderTransientException: a 4xx is mapped
# to a ProviderResult.Rejected value and cannot trigger a retry nor count as a breaker failure.
resilience4j:
  retry:
    instances:
      provider:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.example.challenge.infrastructure.adapter.out.provider.ProviderTransientException
  circuitbreaker:
    instances:
      provider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.example.challenge.infrastructure.adapter.out.provider.ProviderTransientException
