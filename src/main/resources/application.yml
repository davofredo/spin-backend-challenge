spring:
  application:
    name: spin-backend-challenge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/challenge}
    username: ${DB_USERNAME:challenge}
    password: ${DB_PASSWORD:challenge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8081}
  connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
  read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
