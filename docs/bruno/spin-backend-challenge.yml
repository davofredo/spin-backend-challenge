opencollection: 1.0.0
info:
  name: spin-backend-challenge
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: POST
      type: folder
      seq: 1
    request:
      auth: inherit
    items:
      - info:
          name: CREDIT
          type: folder
          seq: 1
        request:
          auth: inherit
        items:
          - info:
              name: success
              type: folder
              seq: 1
            request:
              auth: inherit
            items:
              - info:
                  name: Valid amount greater than DEBIT limit
                  type: http
                  seq: 1
                http:
                  method: POST
                  url: http://localhost:8080/transactions
                  headers:
                    - name: Content-Type
                      value: application/json
                    - name: Accept
                      value: application/json
                    - name: Idempotency-Key
                      value: '{{$randomUUID}}'
                  body:
                    type: json
                    data: |-
                      {
                        "accountId": "account-0002",
                        "type": "CREDIT",
                        "amount": 15000.00,
                        "currency": "MXN",
                        "description": "Successful CREDIT transaction for $15,000.00 MXN."
                      }
                  auth: inherit
                settings:
                  encodeUrl: true
                  timeout: 0
                  followRedirects: true
                  maxRedirects: 5
                  forwardAuthorizationHeader: false
              - info:
                  name: Valid amount lower than DEBIT limit
                  type: http
                  seq: 2
                http:
                  method: POST
                  url: http://localhost:8080/transactions
                  headers:
                    - name: Content-Type
                      value: application/json
                    - name: Accept
                      value: application/json
                    - name: Idempotency-Key
                      value: '{{$randomUUID}}'
                  body:
                    type: json
